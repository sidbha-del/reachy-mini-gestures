<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reachy Camera</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  video.mirror { transform: scaleX(-1); }
  .glass { background: rgba(20, 20, 24, 0.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.12); }
  .top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  .status { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff9f0a; animation: pulse 1.5s ease-in-out infinite; }
  .dot.live { background: #30d158; animation: none; box-shadow: 0 0 0 3px rgba(48, 209, 88, 0.25); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .bottom { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .stats { height: 32px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .round { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .round svg { width: 26px; height: 26px; }
  .round:active { transform: scale(0.94); }
  .tip { position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 72px); transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 13px; color: rgba(255, 255, 255, 0.85); white-space: nowrap; transition: opacity 0.6s; }
  .center { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, #1c1c22, #000); }
  .card { max-width: 340px; padding: 26px 22px 20px; border-radius: 26px; text-align: center; }
  .card-icon { font-size: 44px; }
  .card-title { margin-top: 8px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .card-sub { margin-top: 6px; font-size: 14px; color: rgba(235, 235, 245, 0.66); }
  .btn { margin-top: 18px; width: 100%; height: 50px; border: 0; border-radius: 14px; background: #0a84ff; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  [hidden] { display: none !important; }
  .place { position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 50px); transform: translateX(-50%); width: min(300px, calc(100% - 32px)); margin: 0; padding: 10px 12px 10px; border-radius: 20px; transition: opacity 0.6s; }
  .place.gone { opacity: 0; pointer-events: none; }
  .place svg { width: 100%; height: auto; display: block; }
  .place svg * { fill: none; stroke: rgba(255, 255, 255, 0.8); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .place .pl-fill { fill: rgba(255, 255, 255, 0.8); stroke: none; }
  .place .pl-floor { stroke: rgba(255, 255, 255, 0.25); }
  .place .pl-phone rect { stroke: #0a84ff; fill: rgba(10, 132, 255, 0.25); }
  .place .pl-phone .pl-fill { fill: #0a84ff; }
  .place .pl-phone { transform-box: fill-box; transform-origin: 50% 100%; animation: pl-drop 4s ease infinite; }
  .place .pl-cone { fill: #0a84ff; stroke: none; opacity: 0; animation: pl-cone 4s ease infinite; }
  .place .pl-dist { stroke: rgba(255, 255, 255, 0.4); stroke-width: 1.2; stroke-dasharray: 3 4; }
  .place .pl-text { fill: rgba(255, 255, 255, 0.6); stroke: none; font-size: 8px; font-weight: 600; text-anchor: middle; }
  .place figcaption { margin-top: 4px; font-size: 12.5px; text-align: center; color: rgba(235, 235, 245, 0.8); }
  @keyframes pl-drop { 0% { transform: translateY(-26px); opacity: 0; } 22% { transform: translateY(0); opacity: 1; } 34%, 88% { transform: translateY(0) rotate(-8deg); opacity: 1; } 100% { transform: translateY(0) rotate(-8deg); opacity: 0; } }
  @keyframes pl-cone { 0%, 34% { opacity: 0; } 52% { opacity: 0.3; } 70% { opacity: 0.12; } 84% { opacity: 0.26; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .place .pl-phone { animation: none; transform: rotate(-8deg); } .place .pl-cone { animation: none; opacity: 0.2; } }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div class="top"><div class="status glass"><span class="dot" id="dot"></span><span id="status-text">Starting camera…</span></div></div>
<div class="tip glass" id="tip">Prop your phone up so it sees your hands</div>

<figure class="place glass" id="place" aria-label="Stand the phone just in front of Reachy, camera facing you">
  <svg viewBox="0 0 240 112" aria-hidden="true">
    <line class="pl-floor" x1="8" y1="96" x2="232" y2="96"/>
    <g><circle cx="36" cy="34" r="9"/><path d="M36 44v36M36 54l18-14"/><circle cx="57" cy="37" r="3.5"/></g>
    <polygon class="pl-cone" points="142,70 62,22 62,92"/>
    <g><rect x="176" y="68" width="34" height="28" rx="8"/><rect x="172" y="42" width="42" height="28" rx="13"/><circle cx="184" cy="56" r="2.6" class="pl-fill"/><path d="M184 42l-6-14M202 42l6-14"/></g>
    <g class="pl-phone"><rect x="142" y="64" width="7" height="32" rx="2"/><circle cx="142.5" cy="70" r="1.6" class="pl-fill"/></g>
    <path class="pl-dist" d="M40 104h100"/><text x="90" y="110" class="pl-text">1–2 m</text>
  </svg>
  <figcaption>Stand me <b>just in front of Reachy</b>, facing you · landscape · tilted up a little</figcaption>
</figure>

<div class="bottom">
  <div class="stats glass" id="stats">— fps</div>
  <button class="round glass" id="flip" aria-label="Switch camera">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.2 12.2a3 3 0 0 1 5.3-1.2M14.8 13.8a3 3 0 0 1-5.3 1.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M14.8 9.3v1.9h-1.9M9.2 16.7v-1.9h1.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="center" id="center" hidden>
  <div class="card glass">
    <div class="card-icon" id="center-icon">📷</div>
    <div class="card-title" id="center-title"></div>
    <div class="card-sub" id="center-sub"></div>
    <button class="btn" id="center-btn">Try again</button>
  </div>
</div>

<script src="/static/phone.js?v=__V__"></script>
</body>
</html>
